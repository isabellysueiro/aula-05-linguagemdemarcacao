
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #fff;
            font-family: Arial, sans-serif;
        }

        .menu {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 36px;
            background: #202020;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
        }

        .menu button {
            width: 24px;
            height: 28px;
            border: none;
            background: transparent;
            color: #58739d;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu svg {
            display: block;
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>

<body>

    <nav class="menu">
        <button aria-label="Início">
            <svg viewBox="0 0 24 24">
                <path d="M12 3 1 13h3v8h6v-6h4v6h6v-8h3L12 3z"/>
            </svg>
        </button>

        <button aria-label="Usuário">
            <svg viewBox="0 0 24 24">
                <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-10 2.5-10 6v2h20v-2c0-3.5-5-6-10-6z"/>
            </svg>
        </button>

        <button aria-label="Configurações">
            <svg viewBox="0 0 24 24">
                <path d="M19.4 13a8 8 0 0 0 0-2l2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.7-1L15 3h-4l-.4 3a8 8 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a8 8 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7 1l.4 3h4l.4-3a8 8 0 0 0 1.7-1l2.4 1 2-3.5zM13 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
            </svg>
        </button>

        <button aria-label="Trabalho">
            <svg viewBox="0 0 24 24">
                <path d="M9 3h6a2 2 0 0 1 2 2v2h3a2 2 0 0 1 2 2v11H2V9a2 2 0 0 1 2-2h3V5a2 2 0 0 1 2-2zm0 4h6V5H9v2zm-5 2v3h7v-1h2v1h7V9H4z"/>
            </svg>
        </button>

        <button aria-label="Telefone">
            <svg viewBox="0 0 24 24">
                <path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.2 11 11 0 0 0 3.5.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11 11 0 0 0 .6 3.5 1 1 0 0 1-.2 1z"/>
            </svg>
        </button>
    </nav>

</body>
</html>
